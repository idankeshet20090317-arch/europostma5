<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השירים ליורופוסטמה - עולם המוזיקה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rubik', sans-serif;
            margin: 0;
            padding: 0;
            /* רקע שקיעה געשית - שמים כהים שהופכים לזוהר לוהט באופק */
            background: linear-gradient(180deg, #0d0221 0%, #2c1250 30%, #6e1f3a 58%, #d1502f 78%, #ffb454 100%);
            color: #1a0033;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* עננים הופכים לענני אפר - צבע אפרפר-חום, מיזוג עדין עם הרקע הלוהט */
        .cloud-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/clouds.png') repeat;
            opacity: 0.28;
            z-index: 3;
            pointer-events: none;
            animation: moveClouds 55s linear infinite;
            filter: brightness(0.55) sepia(0.5) hue-rotate(-8deg) contrast(1.2);
            mix-blend-mode: screen;
        }

        @keyframes moveClouds {
            from { background-position: 0 0; }
            to { background-position: 1000px 500px; }
        }

        /* ===== סצנת הר הגעש ===== */
        .volcano-scene {
            position: fixed;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 1100px;
            max-width: 160vw;
            height: 46vh;
            min-height: 340px;
            z-index: 2;
            pointer-events: none;
        }

        .volcano-mountain {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #4a2c1c 0%, #2a160f 45%, #180b08 75%, #0d0605 100%);
            clip-path: polygon(0% 100%, 36% 100%, 45.5% 26%, 50% 16%, 54.5% 26%, 64% 100%, 100% 100%);
            box-shadow: inset 0 -40px 80px rgba(0,0,0,0.5);
        }

        /* פסי סלע עדינים על מדרון ההר */
        .volcano-mountain::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(115deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 6px, transparent 6px, transparent 26px);
            clip-path: polygon(0% 100%, 36% 100%, 45.5% 26%, 50% 16%, 54.5% 26%, 64% 100%, 100% 100%);
            opacity: 0.5;
        }

        /* זוהר הלבה בתוך פי הלוע */
        .crater-glow {
            position: absolute;
            top: 8%;
            left: 50%;
            width: 130px;
            height: 90px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, #fff5b0 0%, #ffb020 35%, #ff5a1f 60%, rgba(255,90,30,0) 80%);
            filter: blur(4px);
            border-radius: 50%;
            animation: craterPulse 2.4s ease-in-out infinite alternate;
        }

        @keyframes craterPulse {
            0% { opacity: 0.65; transform: translateX(-50%) scale(0.92); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.08); }
        }

        /* זרמי לבה זוהרים במורדות */
        .lava-flow {
            position: absolute;
            top: 20%;
            width: 22px;
            height: 62%;
            background: repeating-linear-gradient(180deg, #ffe066 0%, #ff8c1a 18%, #d4300f 36%, #ff8c1a 54%, #ffe066 72%, #ff8c1a 90%, #d4300f 100%);
            background-size: 100% 220%;
            filter: blur(0.5px);
            box-shadow: 0 0 18px 4px rgba(255,120,20,0.75), 0 0 40px 10px rgba(255,60,10,0.35);
            border-radius: 40% 40% 60% 60% / 10% 10% 90% 90%;
            animation: lavaFlow 2.2s linear infinite;
            opacity: 0.9;
        }

        .lava-left {
            left: 42%;
            transform: rotate(11deg);
        }

        .lava-right {
            right: 39%;
            transform: rotate(-9deg);
        }

        @keyframes lavaFlow {
            from { background-position: 0 0; }
            to { background-position: 0 220%; }
        }

        /* בריכת לבה זוהרת בבסיס ההר, נמסה לתוך קו האופק */
        .lava-pool {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 26px;
            background: radial-gradient(ellipse at center, #ffce5c 0%, #ff7a1f 45%, rgba(255,60,10,0) 85%);
            filter: blur(6px);
            animation: craterPulse 3s ease-in-out infinite alternate-reverse;
        }

        /* ניצוצות ואפר עולים מפי הלוע */
        .embers {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .ember {
            position: absolute;
            bottom: 18%;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff2b8 0%, #ff8c1a 55%, rgba(255,90,20,0) 100%);
            box-shadow: 0 0 6px 2px rgba(255,140,30,0.8);
            opacity: 0;
            animation: emberRise linear infinite;
        }

        @keyframes emberRise {
            0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
            8% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { opacity: 0; transform: translate(var(--drift, 40px), -85vh) scale(1.3); }
        }

        .pride-bar {
            height: 10px;
            width: 100%;
            background: linear-gradient(to right, #ff0000, #ff8000, #ffff00, #008000, #0000ff, #a000c0);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        header {
            padding: 130px 20px 40px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            margin-bottom: 30px;
            border-bottom: 3px solid rgba(255,255,255,0.5);
            position: relative;
            z-index: 5;
        }

        header h1 {
            font-size: 3.3rem;
            margin: 0;
            font-weight: 900;
            color: #150050;
            text-shadow: 0 0 25px rgba(255, 255, 255, 1), 2px 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 5;
        }

        .article-card {
            background: rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            padding: 45px 35px;
            margin-bottom: 40px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 55px rgba(0,0,0,0.2), inset 0 0 25px rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        /* כותרת הפלייליסטים */
        .playlist-title {
            color: #1a4fd6;
            font-size: 2.4rem;
            font-weight: 900;
            margin: 0 0 30px 0;
            text-shadow: 3px 3px 0px #fff, -3px -3px 0px #fff, 3px -3px 0px #fff, -3px 3px 0px #fff;
            line-height: 1.3;
        }

        .love-idans {
            color: #ffcc00;
            font-size: 3.2rem;
            font-weight: 700;
            margin: 30px 0 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 1px 1px 0px #000;
        }

        /* כפתורי הפלייליסטים */
        .playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .playlist-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 420px;
            padding: 18px 30px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 2px solid rgba(255,255,255,0.35);
            transition: all 0.25s ease;
        }

        .playlist-btn .btn-icon {
            font-size: 1.7rem;
            line-height: 1;
        }

        .playlist-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 32px rgba(0,0,0,0.35);
        }

        .spotify-btn {
            background: linear-gradient(135deg, #1ed760, #178a3f);
        }

        .spotify-btn:hover {
            background: linear-gradient(135deg, #23e567, #1a9d47);
        }

        .youtube-btn {
            background: linear-gradient(135deg, #ff3b3b, #b30d0d);
        }

        .youtube-btn:hover {
            background: linear-gradient(135deg, #ff5252, #cc1010);
        }

        .back-nav-container {
            text-align: center;
            margin-top: 25px;
        }

        .btn-back-home {
            display: inline-block;
            padding: 12px 40px;
            background: #150050;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-back-home:hover {
            background: white;
            color: #1a0033;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="pride-bar"></div>

    <!-- סצנת הר הגעש ברקע -->
    <div class="volcano-scene">
        <div class="volcano-mountain"></div>
        <div class="crater-glow"></div>
        <div class="lava-flow lava-left"></div>
        <div class="lava-flow lava-right"></div>
        <div class="lava-pool"></div>
    </div>

    <!-- ניצוצות ואפר עולים -->
    <div class="embers" id="embers"></div>

    <div class="cloud-bg"></div>

    <header>
        <h1>🌋 עולם המוזיקה של התחרות 🌋</h1>
    </header>

    <div class="container">

        <div class="article-card">
            <div class="playlist-title">חצי גמר, גמר ראשון ויורופוסטמה 🎶</div>
            <div class="playlist-buttons">
                <a class="playlist-btn spotify-btn" href="https://open.spotify.com/playlist/63cZWAYAkZlJXwx2qudwO3?si=84e8b8b825c34fc9&pt=9c98ad5f407882aa62a21674cc1318fe" target="_blank" rel="noopener noreferrer">
                    <span class="btn-icon">🎧</span>
                    <span>הפלייליסט בספוטיפי</span>
                </a>
                <a class="playlist-btn youtube-btn" href="https://youtube.com/playlist?list=PLU3X-KUoTS5A&si=t3Z5qe-D3sGdvgu8" target="_blank" rel="noopener noreferrer">
                    <span class="btn-icon">▶️</span>
                    <span>הפלייליסט ביוטיוב</span>
                </a>
            </div>
            <div class="love-idans">אוהבים עידנים</div>
        </div>

        <div class="article-card">
            <div class="playlist-title">חצי גמר 2 🎶</div>
            <div class="playlist-buttons">
                <a class="playlist-btn spotify-btn" href="https://open.spotify.com/playlist/0fnX3MikQeLmRV1u4nTInm?si=862191fb8bb14f14&pt=7dd2efb6c22cd4f19839823d2d8455ab" target="_blank" rel="noopener noreferrer">
                    <span class="btn-icon">🎧</span>
                    <span>הפלייליסט בספוטיפי</span>
                </a>
                <a class="playlist-btn youtube-btn" href="https://youtube.com/playlist?list=PLXO-Drso6d-M&si=IShCF1ZOwLrkzJXx" target="_blank" rel="noopener noreferrer">
                    <span class="btn-icon">▶️</span>
                    <span>הפלייליסט ביוטיוב</span>
                </a>
            </div>
            <div class="love-idans">אוהבים עידנים</div>
        </div>

        <div class="back-nav-container">
            <a href="index.html" class="btn-back-home">🏠 חזרה לעמוד הראשי</a>
        </div>

    </div>

    <script>
        // יצירת ניצוצות אפר עולים מפי הלוע באופן אקראי
        (function spawnEmbers() {
            const container = document.getElementById('embers');
            const count = 22;
            for (let i = 0; i < count; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                const leftPercent = 46 + Math.random() * 8; // מרוכז סביב פי הלוע
                const drift = (Math.random() * 160 - 80) + 'px';
                const duration = 4 + Math.random() * 4;
                const delay = Math.random() * 6;
                const size = 3 + Math.random() * 5;
                ember.style.left = leftPercent + '%';
                ember.style.width = size + 'px';
                ember.style.height = size + 'px';
                ember.style.setProperty('--drift', drift);
                ember.style.animationDuration = duration + 's';
                ember.style.animationDelay = delay + 's';
                container.appendChild(ember);
            }
        })();
    </script>

</body>
</html>
