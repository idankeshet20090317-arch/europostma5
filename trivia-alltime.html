<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מונופול יורופוסטמה 🎲</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Rubik', sans-serif;
    margin: 0;
    background: #090a10;
    color: #f2f4fb;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
}

/* Banner Rules */
.rules-banner {
    width: 100%;
    background: linear-gradient(90deg, #dc2626, #f59e0b, #10b981);
    color: #fff;
    text-align: center;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 900;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 100;
}
.rules-banner span { background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 8px; margin: 0 4px; }

header h1 { margin: 15px 0 5px; color: #fde68a; font-size: 2.2rem; text-align: center; }

/* Status Dashboard */
.status-bar {
    display: flex;
    gap: 20px;
    margin: 15px 0;
    justify-content: center;
    flex-wrap: wrap;
}
.player-card {
    background: rgba(255,255,255,0.05);
    border: 3px solid rgba(255,255,255,0.1);
    padding: 12px 24px;
    border-radius: 16px;
    text-align: center;
    min-width: 180px;
}
.player-card.active { border-color: #f59e0b; background: rgba(245,158,11,0.25); box-shadow: 0 0 15px rgba(245,158,11,0.5); }
.p-name { font-weight: 800; font-size: 1.2rem; }
.p-money { font-size: 1.5rem; font-weight: 900; color: #10b981; }

/* Monopoly Board Layout (4-sided ring) */
.board-container {
    position: relative;
    width: 780px;
    height: 780px;
    margin: 10px auto;
    background: #121526;
    border: 4px solid #fde68a;
    border-radius: 16px;
    display: grid;
    grid-template-columns: 120px repeat(13, 1fr) 120px;
    grid-template-rows: 120px repeat(13, 1fr) 120px;
    gap: 4px;
    padding: 4px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

.cell {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4px;
    text-align: center;
    font-size: 0.75rem;
    position: relative;
    font-weight: 700;
}
.cell-title { font-weight: 800; font-size: 0.8rem; margin-top: 2px; }
.cell-price { color: #fde68a; margin-top: 2px; }
.cell-owner { font-size: 0.65rem; color: #a7f3d0; margin-top: 2px; }

/* Colors for seasons */
.s1 { border-top: 5px solid #22d3ee; }
.s2 { border-top: 5px solid #fbbf24; }
.s3 { border-top: 5px solid #ec4899; }
.s4 { border-top: 5px solid #10b981; }

/* Center of the Board */
.board-center {
    grid-column: 2 / 15;
    grid-row: 2 / 15;
    background: radial-gradient(circle, #1e2338 0%, #0f121d 100%);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
}

/* Tokens - עיצוב מוגדל וברור מאוד */
.tokens-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
    z-index: 10;
}
.token {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 900;
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    border: 3px solid #fff;
    transition: transform 0.2s ease-in-out;
    animation: bounce 1s infinite alternate;
}
.token-p1 { 
    background: linear-gradient(135deg, #2563eb, #3b82f6); 
    border-color: #60a5fa; 
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.9);
}
.token-p2 { 
    background: linear-gradient(135deg, #dc2626, #ef4444); 
    border-color: #fca5a5; 
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
}

@keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-4px); }
}

/* Controls & Dice */
.dice-btn {
    background: linear-gradient(135deg, #f59e0b, #dc2626);
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 1.2rem;
    font-weight: 900;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(245,158,11,0.4);
    transition: transform 0.1s;
}
.dice-btn:active { transform: scale(0.95); }
.dice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.dice-result { font-size: 2.8rem; margin: 10px 0; font-weight: 900; }

/* Modal / Card overlay */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-overlay.show { display: flex; }

.card-box {
    background: #1e2338;
    border: 3px solid #fde68a;
    border-radius: 20px;
    max-width: 450px;
    width: 100%;
    padding: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    position: relative;
}

/* Angel / Devil special styles */
.card-box.angel { border-color: #38bdf8; background: linear-gradient(180deg, #0c4a6e 0%, #1e2338 100%); }
.card-box.devil { border-color: #ef4444; background: linear-gradient(180deg, #7f1d1d 0%, #1e2338 100%); }

.card-icon { font-size: 4rem; margin-bottom: 10px; }
.card-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
.card-desc { font-size: 1rem; color: #cbd5e1; margin-bottom: 20px; }

.q-opt {
    display: block;
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
}
.q-opt:hover { background: rgba(255,255,255,0.18); }

@media(max-width:750px){
    .board-container { width: 380px; height: 380px; }
    .cell { font-size: 0.5rem; }
    .cell-title { font-size: 0.55rem; }
    .board-container { grid-template-columns: 50px repeat(13, 1fr) 50px; grid-template-rows: 50px repeat(13, 1fr) 50px; }
    .token { width: 24px; height: 24px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="rules-banner">
    🎯 יעד: להגיע ל-<span>1000 ₪</span> כדי לנצח! | ⚠️ אזהרה: ירידה ל-<span>200 ₪</span> פירושה הפסד מיידי!
</div>

<header>
    <h1>🎲 מונופול יורופוסטמה</h1>
</header>

<div class="status-bar">
    <div class="player-card active" id="p1-card">
        <div class="p-name">👤 אתה (שחקן 1)</div>
        <div class="p-money" id="p1-money">500 ₪</div>
    </div>
    <div class="player-card" id="p2-card">
        <div class="p-name">🤖 בוט (יריב)</div>
        <div class="p-money" id="p2-money">500 ₪</div>
    </div>
</div>

<div class="board-container" id="board">
    <div class="board-center">
        <div style="font-weight: 900; font-size: 1.3rem; color: #fde68a; margin-bottom: 5px;">❓ קלפי הפתעה ❓</div>
        <div class="dice-result" id="diceDisplay">🎲</div>
        <button class="dice-btn" id="rollBtn" onclick="playTurn()">הטלת קוביה</button>
        <p id="gameLog" style="margin-top: 15px; font-weight: 600; color: #94a3b8; font-size: 0.95rem;"></p>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="card-box" id="cardBox">
        <div class="card-icon" id="mIcon">❓</div>
        <div class="card-title" id="mTitle">שאלה</div>
        <div class="card-desc" id="mDesc">תראה את השאלה ותבחר תשובה</div>
        <div id="mOpts"></div>
    </div>
</div>

<script>
/* ================= GAME DATA & QUESTIONS ================= */
const QUESTIONS = [
    { q: "מי המשתתפ/ת שניצח/ה הכי הרבה פעמים ביורופוסטמה?", opts: ["אלונה", "גילי", "ניצן", "עידן קשת"], correct: 0 },
    { q: "מה הניקוד הגבוה ביותר שנרשם אי פעם בגמר?", opts: ["156 (גילי)", "149 (אלונה)", "146 (ניצן)", "160 (עידו)"], correct: 0 },
    { q: "איזו מדינה ייצג עידן קשת ביורופוסטמה 1?", opts: ["איטליה", "בריטניה", "אוסטרליה", "ספרד"], correct: 0 },
    { q: "מי ניצח/ה ביורופוסטמה 2?", opts: ["גילי", "רון", "ניצן", "אלונה"], correct: 0 },
    { q: "איזו מדינה ייצגה אלונה כשניצחה ביורופוסטמה 3?", opts: ["שוודיה", "גרמניה", "ישראל", "איטליה"], correct: 0 },
    { q: "איזו עונה כללה הכי הרבה משתתפים (30 בסך הכל)?", opts: ["עונה 4", "עונה 1", "עונה 2", "עונה 3"], correct: 0 },
    { q: "מי סיים במקום ה-1 בעונה 4?", opts: ["ניצן", "מעין", "שי", "עידו"], correct: 0 },
    { q: "מה שמו של שיר הניצחון של אלונה בעונה 1?", opts: ["Renn!", "FAMOUS", "Everest", "Maschio"], correct: 0 }
];

/* Board Cells Configuration (60 cells around the perimeter) */
const CELLS_CONFIG = [];
for (let i = 0; i < 60; i++) {
    if (i === 0) CELLS_CONFIG.push({ type: 'start', name: 'התחלה 🚀', desc: '+50 ₪' });
    else if (i === 15) CELLS_CONFIG.push({ type: 'cop', name: 'משטרה! 👮‍♂️', desc: 'טוס לכלא!' });
    else if (i === 30) CELLS_CONFIG.push({ type: 'jail', name: 'כלא ⛓️', desc: 'מפספס תור' });
    else if (i === 45) CELLS_CONFIG.push({ type: 'park', name: 'חניה 🅿️', desc: 'מנוחה' });
    else if (i % 4 === 2) CELLS_CONFIG.push({ type: 'chance', name: 'הפתעה ❓' });
    else {
        const season = Math.floor(i / 15) + 1;
        const cost = season * 50;
        CELLS_CONFIG.push({ type: 'prop', name: `יורופוסטמה ${season}`, cost: cost, class: `s${season}` });
    }
}

// Grid mapping for perimeter (clockwise 15x15 ring)
const GRID_POSITIONS = [];
for (let i = 1; i <= 15; i++) GRID_POSITIONS.push({ r: 15, c: i });
for (let i = 14; i >= 1; i--) GRID_POSITIONS.push({ r: i, c: 15 });
for (let i = 14; i >= 1; i--) GRID_POSITIONS.push({ r: 1, c: i });
for (let i = 2; i <= 14; i++) GRID_POSITIONS.push({ r: i, c: 1 });

/* ================= GAME STATE ================= */
let players = [
    { id: 0, name: 'אתה', money: 500, pos: 0, inJail: false, isBot: false },
    { id: 1, name: 'הבוט', money: 500, pos: 0, inJail: false, isBot: true }
];
let cellOwners = Array(60).fill(null);
let turn = 0;
let gameOver = false;

/* ================= BOARD INITIALIZATION ================= */
function initBoard() {
    const board = document.getElementById('board');
    CELLS_CONFIG.forEach((cfg, idx) => {
        const gridPos = GRID_POSITIONS[idx] || {r:1, c:1};
        const cell = document.createElement('div');
        cell.className = `cell ${cfg.class || ''}`;
        cell.style.gridRow = gridPos.r;
        cell.style.gridColumn = gridPos.c;
        cell.id = `cell-${idx}`;
        
        let content = `<div class="cell-title">${cfg.name}</div>`;
        if(cfg.cost) content += `<div class="cell-price">${cfg.cost} ₪</div>`;
        if(cfg.desc) content += `<div style="font-size:0.6rem;color:#94a3b8">${cfg.desc}</div>`;
        content += `<div class="cell-owner" id="owner-${idx}"></div>`;
        content += `<div class="tokens-container" id="tokens-${idx}"></div>`;
        
        cell.innerHTML = content;
        board.appendChild(cell);
    });
    renderTokens();
}

function renderTokens() {
    for(let i=0; i<60; i++) {
        const container = document.getElementById(`tokens-${i}`);
        if(container) container.innerHTML = '';
    }
    players.forEach((p, idx) => {
        const container = document.getElementById(`tokens-${p.pos}`);
        if(container) {
            const token = document.createElement('div');
            token.className = `token ${idx === 0 ? 'token-p1' : 'token-p2'}`;
            token.textContent = idx === 0 ? '👤' : '🤖';
            token.title = `${p.name}`;
            container.appendChild(token);
        }
    });
}

function updateUI() {
    document.getElementById('p1-money').textContent = `${players[0].money} ₪`;
    document.getElementById('p2-money').textContent = `${players[1].money} ₪`;
    
    document.getElementById('p1-card').classList.toggle('active', turn === 0);
    document.getElementById('p2-card').classList.toggle('active', turn === 1);

    cellOwners.forEach((owner, idx) => {
        const el = document.getElementById(`owner-${idx}`);
        if(el && owner !== null) {
            el.textContent = `של: ${players[owner].name}`;
        }
    });

    checkWinLossConditions();
}

function checkWinLossConditions() {
    if(gameOver) return;

    players.forEach(p => {
        if(p.money >= 1000) {
            endGame(`🏆 ${p.name} הגיע/ה ל-1000 ₪ ונצח/ה במשחק!`);
        } else if(p.money <= 200) {
            endGame(`💥 ${p.name} ירד/ה ל-200 ₪ ונפסל/ה מהמשחק!`);
        }
    });
}

function endGame(msg) {
    gameOver = true;
    document.getElementById('rollBtn').disabled = true;
    showModal('🎮 המשחק הסתיים!', msg, '🏆', []);
    confetti({ particleCount: 150, spread: 80 });
}

/* ================= TURN LOGIC ================= */
function playTurn() {
    if(gameOver) return;
    const p = players[turn];

    if(p.inJail) {
        p.inJail = false;
        log(`${p.name} היה בכלא ופיספס תור!`);
        nextTurn();
        return;
    }

    document.getElementById('rollBtn').disabled = true;
    const dice = Math.floor(Math.random() * 6) + 1;
    document.getElementById('diceDisplay').textContent = `🎲 ${dice}`;
    
    p.pos = (p.pos + dice) % 60;
    if(p.pos < dice && p.pos !== 0) {
        p.money += 50;
        log(`${p.name} עבר בנקודת ההתחלה וקיבל 50 ₪!`);
    }

    renderTokens();
    updateUI();

    setTimeout(() => handleCellLanding(p), 600);
}

function handleCellLanding(p) {
    const cell = CELLS_CONFIG[p.pos];
    
    if(cell.type === 'prop') {
        const owner = cellOwners[p.pos];
        if(owner === null) {
            if(p.isBot) {
                if(p.money - cell.cost > 200) {
                    p.money -= cell.cost;
                    cellOwners[p.pos] = p.id;
                    log(`🤖 הבוט קנה את ${cell.name} ב-${cell.cost} ₪`);
                }
                nextTurn();
            } else {
                askToBuy(p, cell);
            }
        } else if(owner !== p.id) {
            triggerTriviaChallenge(p, players[owner], cell);
        } else {
            nextTurn();
        }
    } else if(cell.type === 'chance') {
        triggerChanceCard(p);
    } else if(cell.type === 'cop') {
        p.pos = 30; // Jail cell index
        p.inJail = true;
        renderTokens();
        log(`👮‍♂️ ${p.name} נתפס ע"י המשטרה ונשלח לכלא!`);
        nextTurn();
    } else {
        nextTurn();
    }
}

/* ================= TRIVIA & PROPERTY LANDING ================= */
function askToBuy(p, cell) {
    showModal(`רכישת ${cell.name}`, `האם ברצונך לקנות בלוק זה בעלות של ${cell.cost} ₪?`, '🏠', [
        { text: `קנה ב-${cell.cost} ₪`, action: () => {
            if(p.money - cell.cost <= 200) {
                alert("אין לך מספיק כסף! קנייה זו תגרום לך להפסד מיידי.");
                nextTurn();
                return;
            }
            p.money -= cell.cost;
            cellOwners[p.pos] = p.id;
            log(`קנית את ${cell.name}!`);
            hideModal();
            nextTurn();
        }},
        { text: 'ווותר', action: () => { hideModal(); nextTurn(); } }
    ]);
}

function triggerTriviaChallenge(visitor, owner, cell) {
    const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
    const refundAmount = Math.round(cell.cost * 1.25);

    if(visitor.isBot) {
        const botFailed = Math.random() < 0.50; // 50% chance to fail
        if(botFailed) {
            owner.money += refundAmount;
            log(`🤖 הבוט טעה בשאלה! ${owner.name} מקבל/ת ${refundAmount} ₪!`);
        } else {
            log(`🤖 הבוט ענה נכון על השאלה ולא משלם פיצוי.`);
        }
        nextTurn();
    } else {
        const shuffledOpts = [...q.opts].sort(() => Math.random() - 0.5);
        showModal(
            `עמדת על הנכס של ${owner.name}!`,
            `ענה נכון כדי להימנע מפיצוי. אם תטעה, ${owner.name} יקבל ${refundAmount} ₪!<br><br><b>${q.q}</b>`,
            '🧠',
            shuffledOpts.map(opt => ({
                text: opt,
                action: () => {
                    if(opt === q.opts[q.correct]) {
                        alert("תשובה נכונה! ניצלת מתשלום.");
                    } else {
                        visitor.money -= refundAmount;
                        owner.money += refundAmount;
                        alert(`תשובה שגויה! העברת ${refundAmount} ₪ ל-${owner.name}.`);
                    }
                    hideModal();
                    nextTurn();
                }
            }))
        );
    }
}

/* ================= CHANCE CARDS (ANGEL / DEVIL) ================= */
function triggerChanceCard(p) {
    const isAngel = Math.random() > 0.5;
    const q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];

    if(p.isBot) {
        const botSuccess = Math.random() > 0.50;
        if(isAngel) {
            if(botSuccess) p.money += 50;
        } else {
            if(!botSuccess) p.inJail = true;
        }
        nextTurn();
        return;
    }

    const cardTypeClass = isAngel ? 'angel' : 'devil';
    const cardTitle = isAngel ? '😇 קלף מלאך!' : '😈 קלף שטן!';
    const cardDesc = isAngel 
        ? `אתגר המלאך: ענה נכון ותרוויח 50 ₪!<br><br><b>${q.q}</b>`
        : `אתגר השטן: ענה נכון או שתפסיד תור!<br><br><b>${q.q}</b>`;

    const shuffledOpts = [...q.opts].sort(() => Math.random() - 0.5);

    showModal(
        cardTitle,
        cardDesc,
        isAngel ? '😇' : '😈',
        shuffledOpts.map(opt => ({
            text: opt,
            action: () => {
                const isCorrect = (opt === q.opts[q.correct]);
                if(isAngel) {
                    if(isCorrect) { p.money += 50; alert("נכון מאוד! קיבלת 50 ₪!"); }
                    else { alert("טעות! לא קיבלת פרס."); }
                } else {
                    if(!isCorrect) { p.inJail = true; alert("טעות! התור הבא שלך מבוטל!"); }
                    else { alert("תשובה נכונה! ניצלת מעונש השטן."); }
                }
                hideModal();
                nextTurn();
            }
        })),
        cardTypeClass
    );
}

/* ================= HELPERS & FLOW ================= */
function nextTurn() {
    updateUI();
    if(gameOver) return;
    turn = (turn + 1) % 2;
    document.getElementById('p1-card').classList.toggle('active', turn === 0);
    document.getElementById('p2-card').classList.toggle('active', turn === 1);

    if(turn === 1) {
        log("התור של הבוט...");
        setTimeout(playTurn, 1200);
    } else {
        document.getElementById('rollBtn').disabled = false;
    }
}

function log(msg) {
    document.getElementById('gameLog').textContent = msg;
}

function showModal(title, desc, icon, options, extraClass = '') {
    const modal = document.getElementById('modal');
    const box = document.getElementById('cardBox');
    box.className = `card-box ${extraClass}`;
    document.getElementById('mTitle').innerHTML = title;
    document.getElementById('mDesc').innerHTML = desc;
    document.getElementById('mIcon').textContent = icon;
    
    const optsDiv = document.getElementById('mOpts');
    optsDiv.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'q-opt';
        btn.innerHTML = opt.text;
        btn.onclick = opt.action;
        optsDiv.appendChild(btn);
    });
    
    modal.classList.add('show');
}

function hideModal() {
    document.getElementById('modal').classList.remove('show');
}

// Start game
